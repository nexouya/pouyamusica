[package]
name = "pouya-music"
version = "0.1.0"
description = "pouya music — Liquid Glass music player"
authors = ["pouya studio"]
edition = "2021"
default-run = "pouya-music"

[lib]
name = "pouya_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pouya-music"
path = "src/main.rs"

[features]
# Required for production builds: serves frontend from embedded assets.
# `tauri build` enables this automatically. Without it, the WebView always
# loads devUrl (localhost:1420) and needs a separate Vite server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
rustfft = "6"
lofty = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
notify = "7"
window-vibrancy = "0.5"
parking_lot = "0.12"
anyhow = "1"
thiserror = "2"
dirs = "6"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
crossbeam-channel = "0.5"


